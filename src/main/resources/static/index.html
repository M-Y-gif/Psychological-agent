<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理 Agent · 多模态问答测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #fdf2f8 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
      max-width: 680px; width: 100%; padding: 32px;
    }
    h1 { font-size: 20px; color: #1f2937; margin-bottom: 6px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    textarea {
      width: 100%; min-height: 80px; border: 1px solid #d1d5db; border-radius: 10px;
      padding: 12px; font-size: 14px; font-family: inherit; resize: vertical;
    }
    textarea:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #6366f1; color: #fff; font-size: 15px; cursor: pointer;
    }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .section { margin-top: 20px; }
    .label { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
    .answer {
      background: #f9fafb; border-radius: 10px; padding: 14px; font-size: 14px;
      line-height: 1.7; color: #111827; white-space: pre-wrap; min-height: 40px;
    }
    .source {
      background: #eef2ff; border-radius: 8px; padding: 10px 12px; margin-top: 8px;
      font-size: 12px; color: #4338ca; word-break: break-all;
    }
    .error { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 12px; font-size: 13px; }
    .risk {
      background: #fff1f2; border: 1px solid #fecdd3; color: #be123c;
      border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.7; margin-top: 12px;
    }
    .risk b { font-size: 15px; }
    .hint { margin-top: 16px; font-size: 12px; color: #9ca3af; line-height: 1.6; }
    code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .mm-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .mm-row label { flex: 1; min-width: 180px; font-size: 13px; color: #374151; }
    .mm-row input { display: block; margin-top: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧠 心理 Agent · 多模态问答测试</h1>
    <p class="sub">Agent 工具调用 · 高风险预警 · 语音/表情多模态感知</p>

    <div class="section">
      <div class="label">🎙️ 多模态感知（上传语音 / 人脸图，自动填入转写文本并携带情绪特征）</div>
      <div class="mm-row">
        <label>语音文件（wav/mp3）
          <input type="file" id="audioFile" accept="audio/*">
        </label>
        <label>人脸图片
          <input type="file" id="imageFile" accept="image/*">
        </label>
      </div>
      <button id="mmBtn" style="background:#0891b2;">分析情绪特征</button>
      <div id="mmResult" class="answer" style="margin-top:10px;min-height:30px;font-size:13px;">等待分析…</div>
    </div>

    <div class="section" style="border-top:1px solid #e5e7eb;padding-top:18px;">
      <div class="label">💬 提问（可直接输入，或用语音转写结果）</div>
      <textarea id="q" placeholder="例如：什么是认知歪曲？&#10;或者：我最近很焦虑，有什么放松的方法？"></textarea>
      <button id="btn">发送提问</button>
    </div>

    <div class="section">
      <div class="label">回答</div>
      <div id="answer" class="answer">等待提问…</div>
    </div>

    <div id="riskBox"></div>

    <div class="section">
      <div class="label">命中的知识片段（来源）</div>
      <div id="sources"></div>
    </div>

    <p class="hint">
      提示：高风险（≥2 级）会显示红色预警条，并自动触发邮件预警 + Excel 留痕。<br>
      如果显示“服务器处理失败”，请确认大模型 API Key 已配置（见 <code>README.md</code>）。
    </p>
  </div>

  <script>
    const q = document.getElementById('q');
    const btn = document.getElementById('btn');
    const answer = document.getElementById('answer');
    const sources = document.getElementById('sources');
    const riskBox = document.getElementById('riskBox');
    let lastEmotionContext = null;

    function renderRisk(data) {
      if (data.riskLevel != null && data.riskLevel >= 2) {
        riskBox.innerHTML = `<div class="risk">⚠️ <b>检测到高风险信号（等级 ${data.riskLevel}/3）</b><br>${data.riskReason || ''}<br>建议立即联系心理援助热线 <b>12356</b> 或寻求线下专业帮助。</div>`;
      } else if (data.riskLevel != null) {
        riskBox.innerHTML = `<div class="risk">风险等级 ${data.riskLevel}/3（${data.riskReason || ''}）</div>`;
      } else {
        riskBox.innerHTML = '';
      }
    }

    function renderSources(items) {
      sources.innerHTML = items && items.length
        ? items.map(s => `<div class="source">📄 ${s.source} · 相似度 ${s.score.toFixed(4)}<br>${s.snippet}</div>`).join('')
        : '<div class="source">未命中知识库片段</div>';
    }

    async function sendChat() {
      const question = q.value.trim();
      if (!question) return;
      btn.disabled = true;
      btn.textContent = '思考中…';
      answer.textContent = '正在检索知识库、评估风险并生成回答…';
      sources.innerHTML = '';
      riskBox.innerHTML = '';
      try {
        const body = { question };
        if (lastEmotionContext) {
          body.emotionContext = lastEmotionContext;   // 直接传 JSON 对象
          answer.textContent = '正在结合多模态情绪特征综合研判…';
        }
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          answer.textContent = '';
          sources.innerHTML = `<div class="error">${data.error || ('请求失败：HTTP ' + res.status)}</div>`;
          return;
        }
        answer.textContent = data.answer || '（无回答）';
        renderRisk(data);
        renderSources(data.sources);
      } catch (e) {
        answer.textContent = '';
        sources.innerHTML = `<div class="error">请求异常：${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '发送提问';
      }
    }

    btn.addEventListener('click', sendChat);
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendChat();
    });

    const mmBtn = document.getElementById('mmBtn');
    const mmResult = document.getElementById('mmResult');

    mmBtn.addEventListener('click', async () => {
      const audio = document.getElementById('audioFile').files[0];
      const image = document.getElementById('imageFile').files[0];
      if (!audio && !image) { mmResult.textContent = '请至少选择一个语音文件或图片'; return; }
      mmBtn.disabled = true;
      mmBtn.textContent = '分析中…';
      mmResult.textContent = '正在调用多模态感知引擎（Whisper 转写 + 表情分析）…';
      const fd = new FormData();
      if (audio) fd.append('audio', audio);
      if (image) fd.append('image', image);
      try {
        const res = await fetch('/api/multimodal/analyze', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) {
          mmResult.innerHTML = `<div class="error">${data.error || ('HTTP ' + res.status)}</div>`;
          return;
        }
        const text = data.text || '';
        let html = '';
        if (text) html += `🗣️ 转写：${text}<br>`;
        if (data.features_json) html += `📊 情绪特征：${data.features_json}`;
        if (data.emotion_label) html += `<br>😊 表情：${data.emotion_label}（微笑 ${data.smile_score}）`;
        if (data.duration_sec) html += `<br>⏱️ 语速 ${data.speech_rate_chars_per_sec} 字/秒，停顿 ${data.pause_count} 次`;
        if (!html) html = '未获得有效分析结果：' + JSON.stringify(data);
        mmResult.innerHTML = html;
        // 把特征保存为 JSON 对象，并在有转写时自动填入问题框
        if (data.features_json) {
          try { lastEmotionContext = JSON.parse(data.features_json); } catch (e) { lastEmotionContext = data.features_json; }
        }
        if (text) {
          q.value = text;
          btn.textContent = '发送提问（将携带情绪特征）';
        }
      } catch (e) {
        mmResult.innerHTML = `<div class="error">请求异常：${e.message}</div>`;
      } finally {
        mmBtn.disabled = false;
        mmBtn.textContent = '分析情绪特征';
      }
    });
  </script>
</body>
</html>
