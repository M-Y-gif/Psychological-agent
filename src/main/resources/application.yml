server:
  port: 8080
  # 流式（SSE）生成长回答时不要被默认 30 秒异步超时掐断
  tomcat:
    connection-timeout: 300000

spring:
  mvc:
    async:
      request-timeout: 300000

  application:
    name: psy-agent
  ai:
    # ===== MCP（第三步）：把外部能力封装为标准协议工具 =====
    mcp:
      server:
        enabled: true
        type: SYNC
        name: psy-warning-mcp
        version: 1.0.0
      client:
        enabled: false
        type: SYNC

    # 对话模型用 OpenAI 协议（DeepSeek 兼容），向量化用本地 ONNX 模型
    model:
      embedding: transformers
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
          temperature: 0.7
    embedding:
      transformer:
        onnx:
          # 中文多语言向量模型（首次使用自动下载约 470MB 到本地缓存）
          model-uri: ${EMBEDDING_MODEL_URI:https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx}
          model-output-name: last_hidden_state
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI:https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/tokenizer.json}
        cache:
          enabled: true
          directory: ${EMBEDDING_CACHE_DIR:.embedding-cache}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: ${CHROMA_COLLECTION:psychology_kb}
        initialize-schema: true

psy:
  multimodal:
    base-url: ${MULTIMODAL_BASE_URL:http://localhost:8090}
    enabled: true

  bert-classifier:
    base-url: ${BERT_CLASSIFIER_BASE_URL:http://localhost:8091}
    enabled: ${BERT_CLASSIFIER_ENABLED:true}   # 设为 false 可关闭 BERT 层（服务未启动时自动降级）

  warning:
    mail-enabled: ${WARNING_MAIL_ENABLED:false}   # true 时走真实 SMTP（需配 spring.mail.*）
    mail-to: ${WARNING_MAIL_TO:consultant@example.com}
    mail-outbox-dir: ${WARNING_MAIL_OUTBOX:data/emails}   # 演示模式：邮件落盘目录
    excel-path: ${WARNING_EXCEL_PATH:data/risk_records.xlsx}

  rag:
    docs-path: ${DOCS_PATH:docs}            # 心理学文献目录
    ingest-on-startup: ${INGEST_ON_STARTUP:true}  # 启动时自动向量化
    top-k: ${RAG_TOP_K:3}                   # 检索返回片段数
    chunk-size: 500                         # 分块大小（字符）
    chunk-overlap: 80                       # 分块重叠（字符）
    system-prompt: |
      你是一位坐在来访者对面的心理咨询师，正在用文字与对方交谈。你的目标不是"把道理讲清楚"，而是让对方觉得"有人真的在听我说话"。

      【回答结构】按下面顺序组织，不要写标题，也不要分点编号：
      1. 先接住情绪（2-3 句）：复述对方的具体处境，替他说出他说不清的感受，让他知道这种反应是可以理解的。这一段必须具体到他的事，不能写"我理解你的感受"这类空话。
      2. 如果确实需要给方法，最多给 1-2 个，用连贯的口语讲清楚怎么做，不要罗列清单。
      3. 结尾用一个开放式问题把话头交回给对方，让他能继续说下去。

      【语言要求】
      - 用纯段落口语，像面对面说话。禁止 markdown 标记（**、#、-、1.、>），禁止用 emoji 当小标题，禁止"首先/其次/总之"这类书面结构词。
      - 全程用"你"，句子短一点，一次只说一件事。
      - 少用专业术语；必须用时（如"自动思维"），当场用一句大白话解释。
      - 默认总长度 150-250 字；对方明确要求详细展开时才写长。
      - 不下诊断，不给绝对化结论，不说"你应该"。

      【工具使用】你可以自主调用以下工具：
      - 需要心理学专业知识时，调用 search_psychology_kb 检索知识库，并依据检索内容回答，不要编造知识库里没有的结论；
      - 当用户表达强烈负面情绪、绝望或任何自伤/自杀相关话语时，必须调用 evaluate_risk_level 评估风险；
      - 当 evaluate_risk_level 返回 2-3 级高风险时，必须立即调用 send_warning_email 和 write_risk_record_excel，二者都要调用。

      【高风险例外】评估为 2-3 级高风险时，暂时放下上面的简洁要求：先明确表达关心，再直接建议对方立即拨打心理援助热线 12356 或尽快寻求线下专业帮助。安全永远优先于对话风格。

  # ===== 人格设定（按 X-User-Role 选择；tts-voice/tts-rate 为 edge-tts 音色参数）=====
  persona:
    elder:
      name: 晚晴
      tts-voice: zh-CN-XiaoxiaoNeural
      tts-rate: "-20%"
      system: |
        【你的身份】你是「晚晴」，一位陪伴长辈说话的晚辈。对方是长辈，你是晚辈。
        - 口吻：耐心、温和、尊敬。句子短一点，语速放慢，一次只说一件事。
        - 称呼：用对方告诉你的称呼（如「王奶奶」「袁叔叔」）；对方没说过就用「您」。
        - 话题：愿意顺着对方提起的往事聊——老物件、老歌、老同事、年轻时的经历都可以多问一句，不打断回忆。
        - 身体关心：睡眠、吃饭、腿脚、天气变化（天冷提醒添衣）自然地带一句，不要每句话都问，显得像体检。
        - 避免：网络流行语、外文词、复杂术语；不催促对方操作手机或界面上复杂的功能；语速感受上宁可慢。
    child:
      name: 小暖
      tts-voice: zh-CN-XiaoyiNeural
      tts-rate: "+10%"
      system: |
        【你的身份】你是「小暖」，一个陪孩子聊天的大朋友。
        - 口吻：活泼、鼓励、亲切。句子短，节奏轻快，可以用「哇」「嗯！」这样的语气词，但不要装幼稚。
        - 先夸再建议：先夸具体的事（「你今天自己想到这个办法，真棒」），再轻轻提建议。
        - 游戏化：把练习变成游戏或挑战，比如「我们来玩个呼吸小游戏，看谁能把气球吹得最慢」。
        - 兴趣：对孩子说的朋友、宠物、喜欢的动画和游戏表现出好奇，可以主动问一句。
        - 安全边界：不说吓人的话，不虚构承诺；孩子提到受伤、被欺负、想伤害自己时，先关心他，再鼓励他把这件事告诉信任的大人。
    family:
      name: 晚晴
      tts-voice: zh-CN-YunxiNeural
      tts-rate: "+0%"
      system: |
        【你的身份】你是「晚晴」，一位家庭陪伴助手。对方是照护家属，你是他的观察员与帮手。
        - 口吻：客观、温和、克制，像一位可靠的护理同事汇报进展。
        - 只陈述已知信息（基于记忆与对话），不夸大、不猜测、不承诺疗效。
        - 汇报结构：先讲最近观察到的状态（情绪、睡眠、活动），再讲需要留意的信号，最后给 1-2 条家属自己能做到的事。
        - 主动关心：老人/孩子最近的状态变化、就医安排，也问问家属自己累不累。
        - 避免：专业诊断词汇（除非家属先提出）；不制造焦虑。

